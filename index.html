<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

     <div class="container">

        <aside class="sidebar">
            <div class="logo-container">
                <img src="img/odin-lined.png" alt="Odin Logo" class="logo-img" /><h1>ODIN</h1>
            </div>
            
            <div class="photo-credit">
                Photo by <a href="https://unsplash.com/@haliewestphoto" target="_blank" rel="noopener">Halie West</a> on <a href="https://unsplash.com" target="_blank" rel="noopener">Unsplash</a>
            </div>
        </aside>

        <main class="main-content">

            <div class="introduction">
                <p>This is not a real online service! You know you need something like 
                    this in your life to hel you realize your deepest dreams.
                    Sign up now to get started.
                </p>
                <p>You <em>know</em> you want to.</p>
            </div>

            <section class="form-section">
                <h2>Let's do this!</h2>

                <form action="#" method="POST" class="signup-form">
                        
                    <div class="form-row">
                        <div class="input-group">
                            <label for="fname">First Name </label>
                            <input type="text" id="fname" name="fname" placeholder="Victor" autocomplete="given-name" required />
                        </div>

                        <div class="input-group">
                            <label for="lname">Last Name </label>
                            <input type="text" id="lname" name="lname" placeholder="Doom" autocomplete="family-name" required />
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="input-group">
                            <label for="email">Email </label>
                            <input type="email" id="email" name="email" autocomplete="email" required />
                        </div>

                        <div class="input-group">
                            <label for="phone_number">Phone number </label>
                            <input type="tel" id="phone_number" name="phone_number" autocomplete="tel" />
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="input-group">
                            <label for="password">Password </label>
                            <input type="password" id="password" name="password" class="error-border" required />
                            <span class="error-text">* Passwords do not match</span>
                        </div>

                        <div class="input-group">
                            <label for="confirm_password">Confirm password </label>
                            <input type="password" id="confirm_password" name="confirm_password" class="error-border" />
                        </div>
                    </div>
                        
                </form>
            </section>
        

            <div class="action-section">
                <button type="submit" form="signup-form">Create Account</button>
                <p>Already have an account? <a href="#">Log in</a></p>
            </div>

        </main>
    </div>

</body>
</html>
